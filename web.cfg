\Preamble{xhtml}
% Make the shared mathematical commands available to MathJax.
\Configure{MathJaxMacros}{macros.tex}

% Typeset mathematics inside TikZ diagrams using LaTeX.
\tikzset{every picture/.append code={\RestoreMathJaxEnvironments}}
\Css{body{max-width:56rem;margin:2rem auto;padding:0 1.25rem;line-height:1.7;font-family:Georgia,serif;color:rgb(35,35,35);background:rgb(255,253,248);}}
\Css{a{color:rgb(105,62,30);} a:hover{text-decoration:none;}}
\Css{h1,h2,h3,h4{line-height:1.25;} .tableofcontents{line-height:1.9;}}
\Css{div.theorem,div.lemma,div.proposition,div.definition,div.remark{margin:1.25rem 0;}}
\Css{img{max-width:100vw;} @media(max-width:600px){body{margin:1rem auto;}}}
\begin{document}
\EndPreamble
